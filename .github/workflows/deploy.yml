name: Deploy to staging

# Triggers Cloudways' own Git deployment via the Cloudways API when code is
# pushed to main.
#
# Why the API and not rsync over SSH: Cloudways restricts SSH/SFTP to
# whitelisted IP addresses. GitHub-hosted runners come from a large, shifting
# pool, so they cannot be whitelisted without effectively opening port 22 to
# the internet. This workflow only makes an OUTBOUND HTTPS call to
# api.cloudways.com, so the SSH whitelist is irrelevant.
#
# Required secrets:
#   CLOUDWAYS_ACCESS_TOKEN  — API Access Token, Limited Access / Git scope
#   CLOUDWAYS_SERVER_ID
#   CLOUDWAYS_APP_ID
#
# Prerequisite: Cloudways' own "Deployment via Git" must be CONFIGURED for
# the app (repo + branch + deployment path), with Cloudways' deploy key added
# to this GitHub repo. This workflow presses that button; it does not replace
# the configuration.

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Cloudways deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check secrets are present
        env:
          TOKEN: ${{ secrets.CLOUDWAYS_ACCESS_TOKEN }}
          SERVER_ID: ${{ secrets.CLOUDWAYS_SERVER_ID }}
          APP_ID: ${{ secrets.CLOUDWAYS_APP_ID }}
        run: |
          missing=0
          for v in TOKEN SERVER_ID APP_ID; do
            if [[ -z "${!v}" ]]; then
              echo "::error::Secret for $v is not set"
              missing=1
            fi
          done
          exit $missing

      - name: Trigger Git pull
        env:
          TOKEN: ${{ secrets.CLOUDWAYS_ACCESS_TOKEN }}
          SERVER_ID: ${{ secrets.CLOUDWAYS_SERVER_ID }}
          APP_ID: ${{ secrets.CLOUDWAYS_APP_ID }}
          GIT_URL: git@github.com:charlotteoswaldwebdev/dhd-staging.git
          BRANCH: main
        run: |
          # The API Access Token is used directly as a Bearer token. The old
          # /oauth/access_token exchange is for the legacy API Key, which
          # Cloudways is retiring.
          response=$(curl -sS --max-time 60 -w $'\n%{http_code}' \
            -X POST 'https://api.cloudways.com/api/v1/git/pull' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "server_id=${SERVER_ID}" \
            --data-urlencode "app_id=${APP_ID}" \
            --data-urlencode "git_url=${GIT_URL}" \
            --data-urlencode "branch_name=${BRANCH}")

          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          echo "HTTP ${status}"
          printf '%s\n' "$body"

          case "$status" in
            2*)
              echo "::notice::Deployment requested. Check Application → Deployment via Git → logs in the Cloudways panel to confirm it completed."
              ;;
            401|403)
              echo "::error::Cloudways rejected the token (HTTP ${status}). Check CLOUDWAYS_ACCESS_TOKEN is current and has the Git scope."
              exit 1
              ;;
            *)
              echo "::error::Cloudways API returned HTTP ${status}"
              exit 1
              ;;
          esac
