name: Deploy to staging

# Deploys DHD's custom code to the Cloudways staging server over rsync.
#
# Only the four tracked paths are synced. --delete keeps the server tidy
# when files are removed from the repo, and the --exclude list below also
# PROTECTS matching files on the server from deletion (rsync does not
# delete excluded files unless --delete-excluded is passed). That is what
# keeps the host-generated mu-plugins alive.
#
# Required secret:  DEPLOY_SSH_KEY  — private half of the deploy keypair

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — report changes without applying them'
        type: boolean
        default: false

# Never let two deploys overlap.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  SSH_HOST: 64.176.180.39
  SSH_USER: master_swrzshgmkf
  REMOTE_ROOT: /home/master/applications/rdxcacbyuw/public_html

jobs:
  deploy:
    name: rsync to staging
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          # Host key pinned deliberately. ssh refuses to connect on a mismatch,
          # so there is no StrictHostKeyChecking=no anywhere in this workflow.
          printf '%s\n' '64.176.180.39 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKp/lVB8G+3nTLiX2JRM6kntJMKgQ/IG28W2oHAJZE7w' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify connection
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "test -d '$REMOTE_ROOT/wp-content' && echo 'connected, wp-content found'"

      - name: Deploy
        run: |
          PATHS=(
            mu-plugins
            themes/hello-biz-child-main
            themes/hello-theme-child-master
            plugins/heat-loss-calculator
          )

          EXCLUDES=(
            --exclude=.git
            --exclude=.duckversions
            --exclude=.DS_Store
            --exclude=node_modules
            --exclude=automation-by-installatron.php
            --exclude=elementor-safe-mode.php
            --exclude='*.log'
            --exclude='*.bak'
            --exclude='*.orig'
          )

          FLAGS=(-az --delete --itemize-changes --human-readable)
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            FLAGS+=(--dry-run)
            echo "::notice::DRY RUN — nothing will be written"
          fi

          for p in "${PATHS[@]}"; do
            echo "::group::wp-content/$p"
            rsync "${FLAGS[@]}" "${EXCLUDES[@]}" \
              "wp-content/$p/" \
              "$SSH_USER@$SSH_HOST:$REMOTE_ROOT/wp-content/$p/"
            echo "::endgroup::"
          done

      - name: Flush caches
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd '$REMOTE_ROOT' && wp cache flush --quiet && echo 'object cache flushed'"
